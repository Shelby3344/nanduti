<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entrando no grupo… — Ñandutí</title>
<meta name="description" content="Redirecionando para o grupo de ofertas da Ñandutí no WhatsApp.">
<meta name="theme-color" content="#0D7F37">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/assets/img/favicon.svg">
<!-- Sem JS o refresh leva ao convite; com JS o replace evita a volta do botão voltar. -->
<meta http-equiv="refresh" content="1;url=https://chat.whatsapp.com/Kefj36eeuLJDqISXEQpH2C">
<style>
:root{--wa:#0D7F37;--ink:#1F1B1A;--ink-2:#57504D;--f:'Archivo','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#fff;color:var(--ink);font-family:var(--f);padding:1.5rem}
.card{text-align:center;max-width:24rem}
.spin{width:44px;height:44px;margin:0 auto 1rem;border-radius:50%;border:4px solid #DCEFE2;border-top-color:var(--wa);animation:girar .8s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
h1{font-size:1.2rem;margin:0 0 .4rem}
p{margin:0 0 1rem;color:var(--ink-2);font-size:.95rem}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:.7rem 1.6rem;border-radius:99px;background:var(--wa);color:#fff;font-weight:800;text-decoration:none}
small{display:block;margin-top:1rem;color:var(--ink-2);font-size:.8rem}
small a{color:var(--wa)}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<main class="card">
  <div class="spin" aria-hidden="true"></div>
  <h1>Abrindo o WhatsApp…</h1>
  <p>Você está entrando no clube de ofertas da Ñandutí.</p>
  <a class="btn" href="https://chat.whatsapp.com/Kefj36eeuLJDqISXEQpH2C">Toque aqui se não abrir</a>
  <small>Não era isso? <a href="/grupo/">Voltar para a página do clube</a></small>
</main>
<script>
/* Troca o ponto de saída do grupo em um lugar só: GRUPO_URL abaixo. */
(function () {
  'use strict';
  var GRUPO_URL = 'https://chat.whatsapp.com/Kefj36eeuLJDqISXEQpH2C';
  try { location.replace(GRUPO_URL); } catch (e) { location.href = GRUPO_URL; }
})();
</script>
</body>
</html>
